<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="AM comic logo">
  <defs>
    <filter id="comicShadow" x="-20%" y="-20%" width="140%" height="160%">
      <!-- Red shadow (bottom-most) -->
      <feOffset in="SourceAlpha" dx="13" dy="13" result="offsetRed"/>
      <feFlood flood-color="#7a0000" result="colorRed"/>
      <feComposite in="colorRed" in2="offsetRed" operator="in" result="shadowRed"/>
      
      <!-- Black shadow (middle) -->
      <feOffset in="SourceAlpha" dx="8" dy="8" result="offsetBlack"/>
      <feFlood flood-color="#000000" result="colorBlack"/>
      <feComposite in="colorBlack" in2="offsetBlack" operator="in" result="shadowBlack"/>

      <!-- Merge them together -->
      <feMerge>
        <feMergeNode in="shadowRed"/>
        <feMergeNode in="shadowBlack"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(65 165) skewX(-12)" filter="url(#comicShadow)">
    <text
      x="0"
      y="0"
      font-family="Bangers, Impact, Haettenschweiler, 'Arial Black', sans-serif"
      font-size="168"
      font-weight="400"
      letter-spacing="0"
      fill="#ffd93d"
      stroke="#000000"
      stroke-width="8"
      paint-order="stroke fill"
    >A<tspan dy="30">M</tspan></text>
  </g>
</svg>